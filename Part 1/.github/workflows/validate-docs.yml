name: Validate Docs Structure

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  validate-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check Part 1 docs folder exists
        run: |
          if [ ! -d "Part 1/docs" ]; then
            echo "ERROR: Part 1/docs folder is missing."
            exit 1
          fi
          echo "Part 1/docs folder found."

      - name: Check required files exist in Part 1/docs
        run: |
          missing=0

          # ERD image (png or pdf)
          if ! ls Part 1/docs/*.png Part 1/docs/*.pdf 1>/dev/null 2>&1; then
            echo "ERROR: No ERD image (.png or .pdf) found in Part 1/docs."
            missing=1
          else
            echo "ERD file found."
          fi

          # API Endpoint (pdf)
          if ! ls Part 1/docs/*endpoint* Part 1/docs/*Endpoint* 1>/dev/null 2>&1; then
            echo "ERROR: No API Endpoint file found in Part 1/docs."
            missing=1
          else
            echo "API Endpoint file found."
          fi

          # SQL script
          if ! ls Part 1/docs/*.sql 1>/dev/null 2>&1; then
            echo "ERROR: No .sql script found in Part 1/docs."
            missing=1
          else
            echo "SQL script found."
          fi

          if [ "$missing" -eq 1 ]; then
            echo "One or more required files are missing from Part 1/docs."
            exit 1
          fi

          echo "All required files are present. Validation passed."
